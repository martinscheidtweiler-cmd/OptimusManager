name: Optimus Tasks Android build

on:
  push:
    branches:
      - codex/optimus-tasks-android
    paths:
      - 'android-staff/**'
      - '.github/workflows/optimus-tasks-android.yml'
  pull_request:
    paths:
      - 'android-staff/**'
      - '.github/workflows/optimus-tasks-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-staff
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK for review
        uses: actions/upload-artifact@v4
        with:
          name: optimus-tasks-debug-apk
          path: android-staff/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
